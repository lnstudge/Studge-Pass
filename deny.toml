# cargo-deny configuration.
# Docs: https://embarkstudios.github.io/cargo-deny/
# Run with: cargo deny check

[graph]
all-features = true
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "wasm32-unknown-unknown" },
]

[advisories]
version = 2
yanked = "deny"

# RUSTSEC-2026-0387: timing side-channel in crypto-bigint < 0.7.6.
# Pulled in transitively by opaque-ke v4.0.1 → elliptic-curve 0.13 → crypto-bigint 0.5.5.
# opaque-ke has not yet released a version that pins crypto-bigint ≥ 0.7.6.
# Risk: timing side-channel in server-side OPAQUE key-exchange arithmetic, not a
# plaintext-exposure or correctness flaw. Accepted until opaque-ke ships a fix.
# Tracked in THREAT_MODEL.md §18 as open risk R-0405.
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "transitive via opaque-ke v4.0.1; fix blocked on opaque-ke upstream release" },
]

[licenses]
version = 2
# Every licence in this list is GPL-3.0-or-later / AGPL-3.0-or-later compatible.
allow = [
    "AGPL-3.0-or-later",
    "GPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
deny = [
    # TLS, if ever needed, must come from Rustls; never link OpenSSL.
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

# cargo-deny configuration.
# Docs: https://embarkstudios.github.io/cargo-deny/
# Run with: cargo deny check

[graph]
all-features = true
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "wasm32-unknown-unknown" },
]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Every licence in this list is GPL-3.0-or-later / AGPL-3.0-or-later compatible.
allow = [
    "AGPL-3.0-or-later",
    "GPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
deny = [
    # TLS, if ever needed, must come from Rustls; never link OpenSSL.
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

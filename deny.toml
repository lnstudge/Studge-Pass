# cargo-deny configuration.
# Docs: https://embarkstudios.github.io/cargo-deny/
# Run with: cargo deny check

[graph]
all-features = true
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "wasm32-unknown-unknown" },
]

[advisories]
version = 2
yanked = "deny"

# RUSTSEC-2026-0387: timing side-channel in crypto-bigint < 0.7.6.
# Call path: opaque-ke v4.0.1 → voprf v0.5.0 → elliptic-curve v0.13 → crypto-bigint 0.5.5.
# elliptic-curve v0.13 provides the hash2curve abstraction; the actual ristretto255
# scalar arithmetic goes through curve25519-dalek, not crypto-bigint (see D-0402).
# Severity revised to low: the vulnerable big-integer code is compiled but not executed
# on the critical OPAQUE path for our ristretto255 suite.
# Exit condition: upgrade when opaque-ke ships a version pinning crypto-bigint ≥ 0.7.6.
# Tracked in THREAT_MODEL.md §18 as R-0405 (low). Decision in docs/DECISIONS.md D-0402.
ignore = [
    { id = "RUSTSEC-2026-0387", reason = "transitive via opaque-ke v4.0.1; ristretto255 hot paths use curve25519-dalek; see D-0402" },
]

[licenses]
version = 2
# Every licence in this list is GPL-3.0-or-later / AGPL-3.0-or-later compatible.
allow = [
    "AGPL-3.0-or-later",
    "GPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    # CDLA-Permissive-2.0: Community Data License Agreement — Permissive.
    # Used by webpki-roots (Mozilla trust store, transitive via reqwest → hyper-rustls).
    # This is a permissive, GPL-3.0-compatible licence.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
deny = [
    # TLS, if ever needed, must come from Rustls; never link OpenSSL.
    { name = "openssl" },
    { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

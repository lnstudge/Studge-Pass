[package]
name = "studge-core-wasm"
description = "WebAssembly bindings of studge-core for the browser extension."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
studge-core = { path = "../core" }
wasm-bindgen.workspace = true

# getrandom 0.4 has no default backend on wasm32-unknown-unknown. This is the
# documented way to use the browser's Crypto.getRandomValues through
# wasm-bindgen; it applies to the wasm target only, so native builds keep the
# OS backend and do not pull js-sys.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }

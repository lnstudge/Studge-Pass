<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="title desc">
  <title id="title">Studge Pass v1 key hierarchy</title>
  <desc id="desc">The master password and the 128-bit Secret Key are stretched with Argon2id and combined with HKDF to produce the Master Unlock Key. The MUK derives the OPAQUE authentication secret and wraps the Account Key. The Account Key wraps vault keys, vault keys wrap item keys, and item keys encrypt individual fields. Only wrapped keys and ciphertext ever reach the relay.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2dd4bf"/>
    </marker>
    <style>
      .bg { fill: #0d1715; }
      .card { fill: #13241f; stroke: #2c4a41; stroke-width: 1.5; }
      .key { fill: #0f2f2a; stroke: #2dd4bf; stroke-width: 1.8; }
      .ghost { fill: none; stroke: #3f6b60; stroke-width: 1.3; stroke-dasharray: 5 4; }
      .t { fill: #e8f2ef; font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; font-size: 15px; font-weight: 600; }
      .s { fill: #9fb8b1; font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; font-size: 12px; }
      .m { fill: #6ee7c8; font-family: "IBM Plex Mono", Consolas, monospace; font-size: 12px; }
      .h { fill: #e8f2ef; font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; font-size: 20px; font-weight: 650; }
      .l { stroke: #2dd4bf; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .ld { stroke: #3f6b60; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="640" rx="18"/>
  <text class="h" x="40" y="46">Studge Pass key hierarchy (v1)</text>
  <text class="s" x="40" y="68">Every arrow is one-way. Nothing on the right side of the boundary ever leaves the device.</text>

  <!-- Column: derivation -->
  <rect class="card" x="40" y="100" width="230" height="64" rx="10"/>
  <text class="t" x="58" y="128">Master password</text>
  <text class="s" x="58" y="148">NFKC, never stored</text>

  <rect class="key" x="290" y="100" width="230" height="64" rx="10"/>
  <text class="t" x="308" y="128">Secret Key</text>
  <text class="s" x="308" y="148">128 bits · SP1-… · never sent</text>

  <rect class="card" x="40" y="196" width="480" height="64" rx="10"/>
  <text class="t" x="58" y="224">Argon2id</text>
  <text class="m" x="58" y="244">m=64 MiB · t=3 · p=1 · salt=account_salt (16 B)</text>

  <rect class="card" x="40" y="292" width="480" height="64" rx="10"/>
  <text class="t" x="58" y="320">HKDF-SHA256</text>
  <text class="m" x="58" y="340">info="studge/v1/muk" · L=32 · ikm = Argon2id ‖ Secret Key</text>

  <rect class="key" x="40" y="388" width="480" height="64" rx="10"/>
  <text class="t" x="58" y="416">MUK — Master Unlock Key (256-bit)</text>
  <text class="s" x="58" y="436">exists only in device memory while unlocked; zeroized on lock</text>

  <rect class="ghost" x="40" y="484" width="230" height="64" rx="10"/>
  <text class="t" x="58" y="512">Auth secret</text>
  <text class="s" x="58" y="532">HKDF "opaque-password"</text>
  <text class="s" x="58" y="548">→ OPAQUE login with the relay</text>

  <rect class="key" x="290" y="484" width="230" height="64" rx="10"/>
  <text class="t" x="308" y="512">Account Key (AK)</text>
  <text class="s" x="308" y="532">wrapped by k_ak, stored on relay</text>

  <!-- Arrows: derivation column -->
  <path class="l" d="M 155 164 L 155 196"/>
  <path class="l" d="M 280 132 L 40 132"/> <!-- secret key joins the HKDF, drawn as a leftward line into the chain -->
  <path class="l" d="M 155 260 L 155 292"/>
  <path class="l" d="M 155 356 L 155 388"/>
  <path class="l" d="M 100 452 L 100 484"/>
  <path class="l" d="M 330 452 L 330 484"/>

  <text class="s" x="252" y="126">＋</text>

  <!-- Right: wrapping chain -->
  <rect class="card" x="560" y="100" width="400" height="448" rx="12"/>
  <text class="t" x="580" y="130">Key wrapping chain</text>
  <text class="s" x="580" y="150">each step: HKDF for the wrapping key, AEAD for the envelope</text>

  <rect class="key" x="580" y="168" width="360" height="56" rx="9"/>
  <text class="t" x="596" y="192">AK → VK</text>
  <text class="m" x="596" y="211">k_vk = HKDF(AK, salt=vault_id, "studge/v1/vk-wrap")</text>

  <rect class="key" x="580" y="244" width="360" height="56" rx="9"/>
  <text class="t" x="596" y="268">VK → IK</text>
  <text class="m" x="596" y="287">k_ik = HKDF(VK, salt=item_id, "studge/v1/ik-wrap")</text>

  <rect class="key" x="580" y="320" width="360" height="56" rx="9"/>
  <text class="t" x="596" y="344">IK → field key</text>
  <text class="m" x="596" y="363">k_field = HKDF(IK, salt=item_id, "studge/v1/item-field")</text>

  <rect class="card" x="580" y="400" width="360" height="56" rx="9"/>
  <text class="t" x="596" y="424">Field ciphertext</text>
  <text class="s" x="596" y="443">AAD binds item, field name, record type, suite</text>

  <path class="l" d="M 760 224 L 760 244"/>
  <path class="l" d="M 760 300 L 760 320"/>
  <path class="l" d="M 760 376 L 760 400"/>

  <text class="s" x="580" y="490">VK is 256-bit per vault; IK is 256-bit per item.</text>
  <text class="s" x="580" y="508">Wrapped copies live on the relay; the plaintext keys never do.</text>
  <text class="s" x="580" y="526">Shared vaults wrap the VK with HPKE to each member.</text>

  <!-- Footer -->
  <rect class="ghost" x="40" y="576" width="920" height="44" rx="9"/>
  <text class="s" x="58" y="603">Relay-visible material: account_salt, the wrapped AK, wrapped vault/item keys, ciphertext, and metadata (ids, sizes, counts). Never: password, Secret Key, MUK, AK, VK, IK, plaintext, plaintext URLs.</text>
</svg>

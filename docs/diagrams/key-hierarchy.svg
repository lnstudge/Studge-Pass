<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" aria-labelledby="title desc" role="img" viewBox="0 0 1000 640"><title id="title">Studge Pass v1 key hierarchy</title><desc id="desc">The master password and the 128-bit Secret Key are stretched with Argon2id and combined with HKDF to produce the Master Unlock Key. The MUK derives the OPAQUE authentication secret and wraps the Account Key. The Account Key wraps vault keys, vault keys wrap item keys, and item keys encrypt individual fields. Only wrapped keys and ciphertext ever reach the relay.</desc><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#2dd4bf" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.bg{fill:#0d1715}.card{fill:#13241f;stroke:#2c4a41;stroke-width:1.5}.key{fill:#0f2f2a;stroke:#2dd4bf;stroke-width:1.8}.ghost{fill:none;stroke:#3f6b60;stroke-width:1.3;stroke-dasharray:5 4}.s,.t{font-family:&quot;IBM Plex Sans&quot;,&quot;Segoe UI&quot;,system-ui,sans-serif}.t{fill:#e8f2ef;font-size:15px;font-weight:600}.m,.s{font-size:12px}.s{fill:#9fb8b1}.m{fill:#6ee7c8;font-family:&quot;IBM Plex Mono&quot;,Consolas,monospace}.h{fill:#e8f2ef;font-family:&quot;IBM Plex Sans&quot;,&quot;Segoe UI&quot;,system-ui,sans-serif;font-size:20px;font-weight:650}.l{stroke:#2dd4bf;stroke-width:1.6;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1000" height="640" x="0" y="0" class="bg" rx="18"/><text x="40" y="46" class="h">Studge Pass key hierarchy (v1)</text><text x="40" y="68" class="s">Every arrow is one-way. Nothing on the right side of the boundary ever leaves the device.</text><rect width="230" height="64" x="40" y="100" class="card" rx="10"/><text x="58" y="128" class="t">Master password</text><text x="58" y="148" class="s">NFKC, never stored</text><rect width="230" height="64" x="290" y="100" class="key" rx="10"/><text x="308" y="128" class="t">Secret Key</text><text x="308" y="148" class="s">128 bits · SP1-… · never sent</text><rect width="480" height="64" x="40" y="196" class="card" rx="10"/><text x="58" y="224" class="t">Argon2id</text><text x="58" y="244" class="m">m=64 MiB · t=3 · p=1 · salt=account_salt (16 B)</text><rect width="480" height="64" x="40" y="292" class="card" rx="10"/><text x="58" y="320" class="t">HKDF-SHA256</text><text x="58" y="340" class="m">info=&quot;studge/v1/muk&quot; · L=32 · ikm = Argon2id ‖ Secret Key</text><rect width="480" height="64" x="40" y="388" class="key" rx="10"/><text x="58" y="416" class="t">MUK — Master Unlock Key (256-bit)</text><text x="58" y="436" class="s">exists only in device memory while unlocked; zeroized on lock</text><rect width="230" height="64" x="40" y="484" class="ghost" rx="10"/><text x="58" y="512" class="t">Auth secret</text><text x="58" y="532" class="s">HKDF &quot;opaque-password&quot;</text><text x="58" y="548" class="s">→ OPAQUE login with the relay</text><rect width="230" height="64" x="290" y="484" class="key" rx="10"/><text x="308" y="512" class="t">Account Key (AK)</text><text x="308" y="532" class="s">wrapped by k_ak, stored on relay</text><path d="M 155 164 L 155 196" class="l"/><path d="M 280 132 L 40 132" class="l"/><path d="M 155 260 L 155 292" class="l"/><path d="M 155 356 L 155 388" class="l"/><path d="M 100 452 L 100 484" class="l"/><path d="M 330 452 L 330 484" class="l"/><text x="252" y="126" class="s">＋</text><rect width="400" height="448" x="560" y="100" class="card" rx="12"/><text x="580" y="130" class="t">Key wrapping chain</text><text x="580" y="150" class="s">each step: HKDF for the wrapping key, AEAD for the envelope</text><rect width="360" height="56" x="580" y="168" class="key" rx="9"/><text x="596" y="192" class="t">AK → VK</text><text x="596" y="211" class="m">k_vk = HKDF(AK, salt=vault_id, &quot;studge/v1/vk-wrap&quot;)</text><rect width="360" height="56" x="580" y="244" class="key" rx="9"/><text x="596" y="268" class="t">VK → IK</text><text x="596" y="287" class="m">k_ik = HKDF(VK, salt=item_id, &quot;studge/v1/ik-wrap&quot;)</text><rect width="360" height="56" x="580" y="320" class="key" rx="9"/><text x="596" y="344" class="t">IK → field key</text><text x="596" y="363" class="m">k_field = HKDF(IK, salt=item_id, &quot;studge/v1/item-field&quot;)</text><rect width="360" height="56" x="580" y="400" class="card" rx="9"/><text x="596" y="424" class="t">Field ciphertext</text><text x="596" y="443" class="s">AAD binds item, field name, record type, suite</text><path d="M 760 224 L 760 244" class="l"/><path d="M 760 300 L 760 320" class="l"/><path d="M 760 376 L 760 400" class="l"/><text x="580" y="490" class="s">VK is 256-bit per vault; IK is 256-bit per item.</text><text x="580" y="508" class="s">Wrapped copies live on the relay; the plaintext keys never do.</text><text x="580" y="526" class="s">Shared vaults wrap the VK with HPKE to each member.</text><rect width="920" height="44" x="40" y="576" class="ghost" rx="9"/><text x="58" y="603" class="s">Relay-visible material: account_salt, the wrapped AK, wrapped vault/item keys, ciphertext, and metadata (ids, sizes, counts). Never: password, Secret Key, MUK, AK, VK, IK, plaintext, plaintext URLs.</text></svg>
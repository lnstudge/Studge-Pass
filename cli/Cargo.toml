[package]
name = "studge"
description = "Studge Pass command-line client."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
studge-core = { path = "../core" }
studge-sync-transports = { path = "../sync-transports" }
clap = { workspace = true, features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0.154"
rpassword = "7.5.5"
arboard = "3.7.0"
keyring-core = "1.0.1"

zeroize = { version = "1.9.1", features = ["derive"] }
thiserror = "2.0.21"
anyhow = "1.0.98"
blake3 = "1.8.7"
subtle = "2.6.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1.0.0"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
tempfile = "3.23.0"
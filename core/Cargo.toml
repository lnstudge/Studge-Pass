[package]
name = "studge-core"
description = "Studge Pass core: crypto, vault model, op log, sync, import/export, health scoring."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Every version here is pinned in Cargo.lock and justified in docs/DECISIONS.md.
argon2 = "0.6.0"
blake3 = "1.8.7"
chacha20poly1305 = "0.11.0"
ciborium = "0.2.2"
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "signature"] }
getrandom = { version = "0.4.3", features = ["sys_rng"] }
hkdf = "0.13.0"
hpke = { version = "0.15.1", default-features = false, features = ["x25519", "chacha", "getrandom", "alloc"] }
sha2 = "0.11.1"
subtle = "2.6.1"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }
zeroize = { version = "1.9.1", features = ["derive"] }

# Phase 3 additions. None of these implements cryptography itself except
# ml-kem and p256, which are on the AGENTS.md approved list; every choice is
# justified in docs/DECISIONS.md (D-0301).
ml-kem = { version = "0.3.4", features = ["getrandom", "zeroize"] }
p256 = { version = "0.14.0", features = ["pkcs8"] }
quick-xml = { version = "0.42.0", default-features = false }
serde_json = "1.0.154"
totp-rs = { version = "6.0.0", default-features = false, features = ["std", "otpauth", "zeroize"] }

# SQLite is native-only: the browser extension builds core for
# wasm32-unknown-unknown, where a C SQLite cannot go. The browser keeps vaults
# in the extension's own storage instead (Phase 8).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# 0.39 so that libsqlite3-sys ^0.37 unifies with sqlx 0.9 in the relay binary:
# only one crate may link the native SQLite (D-0401).
rusqlite = { version = "0.39.0", features = ["bundled"] }

[dev-dependencies]
proptest = "1.12.0"

[features]
# Exposes fixed-input constructors (nonce, seed, key bytes) so the known-answer
# vectors in core/tests/vectors/ can be reproduced. MUST NOT be enabled for a
# release build: it exists for tests and the crypto_tour example only.
test-vectors = []

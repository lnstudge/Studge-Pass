[package]
name = "studge-sync-transports"
description = "Concrete Transport implementations for Studge Pass (folder and HTTP relay). Native-only; not for wasm32."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
studge-core = { path = "../core" }
ciborium = "0.2.2"
serde_json = "1.0.154"
zeroize = { version = "1.9.1", features = ["derive"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "rustls-tls", "json"] }

[dev-dependencies]
tempfile = "3.23.0"

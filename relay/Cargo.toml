[package]
name = "studge-relay"
description = "Studge Pass sync relay (AGPL-3.0-or-later)."
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-or-later"
repository.workspace = true
publish = false

# Integration tests can import `studge-relay` as a library (the lib target
# re-exports internal types behind #[cfg(test)] so tests are self-contained).
[lib]
name = "studge_relay"
path = "src/lib.rs"

[[bin]]
name = "studge-relay"
path = "src/main.rs"

[dependencies]
# Versions are pinned in Cargo.lock and justified in docs/DECISIONS.md (D-0401).
axum.workspace = true
serde.workspace = true
tokio.workspace = true
studge-core = { path = "../core" }

# OPAQUE (SPEC 4.4): ristretto255, identity KSF (D-0102). `std` pulls the OS
# RNG; serde stays off because protocol messages travel as base64 in JSON.
opaque-ke = { version = "4.0.1", default-features = false, features = ["ristretto255", "std"] }
# The key-exchange hash demanded by TripleDh (the crate's canonical choice).
sha2 = "0.10.9"
# Only used as the OsRng handle opaque-ke's API takes; the OS source itself.
rand = { version = "0.8.5", default-features = false }

# HTTP framework plumbing.
tower = "0.5.2"
tower-http = { version = "0.7.1", features = ["cors", "limit", "timeout", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }

# Configuration and storage (D-0401).
toml = "1.2.0"
ciborium = "0.2.2"
serde_json = "1.0.154"
# rusqlite 0.41.1 with bundled SQLite — the same version as studge-core so
# only one copy of libsqlite3-sys compiles into the binary (D-0401).
rusqlite = { version = "0.41.1", features = ["bundled"] }
zeroize = { version = "1.9.1", features = ["derive"] }

[dev-dependencies]
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0.154"
tempfile = "3.23.0"
